<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                WhatsApp
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to continue to your account.
            </p>


            <form id="loginForm">

                <label>
                    Email or Phone Number
                </label>

                <input
                    type="text"
                    id="emailOrPhone"
                    placeholder="Enter email or phone number"
                    required
                >


                <label>
                    Password
                </label>

                <div class="passwordBox">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>


                <button
                    type="submit"
                    class="loginBtn"
                >
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p class="signupText">

                Don't have an account?

                <a href="signUp.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
